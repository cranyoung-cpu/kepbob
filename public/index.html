<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>

  <title>KEPCO Wiki</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <h1>KEPCO Wiki</h1>

  <script src="app.js" defer></script>

</html>
